[package]
name = "tern-nom"
version = "0.11.0"
edition = "2024"
description = "nix-output-monitor drawn natively in Tern over the Tern Surface Protocol"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tern-sdk = "0.1"

[profile.release]
lto = true
codegen-units = 1
